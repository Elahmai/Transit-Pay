name: transit_pay
description: Smart QR Payment System for Kenya Public Transport
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  firebase_messaging: ^14.7.19
  flutter_local_notifications: ^17.1.2
  google_maps_flutter: ^2.5.3
  geolocator: ^11.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.66.2
  image_picker: ^1.0.7
  intl: ^0.19.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.0
  dio: ^5.4.3
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
